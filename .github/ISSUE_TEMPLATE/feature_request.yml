name: Feature request
description: A tool or workflow you want. Say what you are trying to make.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to make or do?
      description: The beat, sound or workflow, in your words. Name the genre if it matters.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today (in another DAW or by hand)?
  - type: dropdown
    id: mode
    attributes:
      label: Who is it for?
      options: [Beginner, Standard, Pro, Everyone]
