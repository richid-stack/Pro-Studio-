<title>Forge Beat Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: transport strip on top; channel rack beside the piano roll; mixer along the bottom. Dark graphite studio, amber playhead, every channel keeps its own hue. */
:root {
  --bg: #0f1116; --panel: #161921; --panel2: #1c202a; --well: #11141a; --line: #272c38; --line2: #343b4a;
  --fg: #e9ebf1; --dim: #8e95a7; --mute: #596072; --hot: #ffae3d; --hot2: #ff8a2b; --ok: #6fe0b0; --bad: #ff6b57;
  --cell: #222733; --cell2: #1d222d;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); margin: 0;
  padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 1px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.sp { flex: 1; }
.hint { color: var(--mute); font-size: 11px; }

/* transport */
.top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 8px 12px; }
.brand { font: 700 15px var(--ui); letter-spacing: .22em; display: flex; align-items: baseline; gap: 8px; margin-right: 4px; }
.brand small { font: 500 10px var(--ui); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.tbtn { width: 40px; height: 36px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel2); display: grid; place-items: center; }
.tbtn:hover { border-color: var(--dim); }
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }
.tbtn.play[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #1a1100; }
.readout { font: 500 20px var(--mono); background: var(--well); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; min-width: 112px; text-align: center; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.readout small { color: var(--mute); font-size: 10px; margin: 0 2px; }
.fld { display: flex; flex-direction: column; gap: 2px; }
.fld > span { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.fld input, .fld select, .sel { background: var(--well); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; height: 30px; min-width: 0; }
.fld input[type=number] { width: 72px; font: 600 15px var(--mono); text-align: center; }
.fld select { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 12px) 13px, calc(100% - 8px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.chk { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--well); cursor: pointer; user-select: none; }
.chk[aria-pressed="true"] { border-color: var(--hot); color: var(--hot); }
.tk { display: flex; align-items: center; gap: 8px; }
.tk .fld { align-items: center; }
.master-viz { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#spec { width: 150px; height: 36px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; }
.mm { display: flex; gap: 2px; height: 36px; }
.mm .meter { width: 7px; height: 100%; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--well); border: 0; padding: 0 10px; height: 28px; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--hot); color: #1a1100; font-weight: 600; }

/* workspace */
.work { display: grid; grid-template-columns: minmax(0, 780px) minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 1180px) { .work { grid-template-columns: minmax(0, 1fr); } }

/* rack */
.rack-body { display: flex; position: relative; }
.names { flex: none; width: 124px; border-right: 1px solid var(--line); background: var(--panel); position: relative; z-index: 2; }
.names .corner, .steps .ruler { height: 20px; }
.nrow { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 8px; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
.nrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 8px color-mix(in srgb, var(--c) 55%, transparent); }
.nrow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.nrow .m { width: 20px; height: 18px; border-radius: 4px; border: 1px solid var(--line2); background: transparent; font: 600 9px var(--ui); color: var(--mute); padding: 0; }
.nrow .m[aria-pressed="true"] { background: var(--bad); color: #1a0500; border-color: var(--bad); }
.nrow.sel { background: var(--panel2); }
.nrow.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.sep { height: 6px; background: var(--well); border-top: 1px solid var(--line); }
.steps { flex: 1; min-width: 0; overflow-x: auto; position: relative; background: var(--well); scrollbar-width: thin; }
.steps-in { position: relative; width: max-content; }
.ruler { position: relative; }
.ruler i { position: absolute; top: 4px; font: 500 9px var(--mono); color: var(--mute); font-style: normal; }
.ruler i.bar { color: var(--dim); }
.srow { height: 30px; display: flex; align-items: center; padding-left: 2px; border-top: 1px solid var(--line); }
.srow.sel { background: rgba(255,255,255,.025); }
.cell { width: 18px; height: 22px; margin-right: 2px; border-radius: 3px; background: var(--cell); flex: none; position: relative; touch-action: none; }
.cell.g { background: var(--cell2); }
.cell:hover { filter: brightness(1.25); }
.cell.on { background: color-mix(in srgb, var(--c) calc(35% + var(--v) * 65%), #151822); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.cell[data-r]::after { content: attr(data-r); position: absolute; right: 1px; top: 1px; font: 700 8px var(--mono); color: rgba(0,0,0,.72); line-height: 1; }
.cell[data-r=""]::after { content: none; }
.thumb { display: block; margin-left: 2px; cursor: pointer; }
.phead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot); box-shadow: 0 0 10px var(--hot); left: 0; pointer-events: none; display: none; z-index: 3; }
.lane { display: flex; border-top: 1px solid var(--line); }
.lane-l { flex: none; width: 124px; padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.lane-l b { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.lane-l span { color: var(--mute); font-size: 10.5px; line-height: 1.35; }
.lane-r { flex: 1; min-width: 0; overflow: hidden; background: var(--well); }
#vlane { display: block; touch-action: none; cursor: ns-resize; }

/* piano roll */
.roll-wrap { position: relative; }
#rollScroll { height: 392px; overflow: auto; background: var(--well); position: relative; scrollbar-width: thin; }
.roll-in { position: relative; display: flex; }
#keysCv { position: sticky; left: 0; z-index: 2; flex: none; cursor: pointer; touch-action: none; }
#gridCv { flex: none; cursor: crosshair; touch-action: none; }
#rphead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot); box-shadow: 0 0 10px var(--hot); display: none; pointer-events: none; z-index: 3; }
.rl { display: flex; border-top: 1px solid var(--line); background: var(--panel); }
.rl-k { flex: none; width: 56px; font: 600 9px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); padding: 6px; border-right: 1px solid var(--line); }
.rl-s { flex: 1; min-width: 0; overflow: hidden; background: var(--well); }
#rlane { display: block; touch-action: none; cursor: ns-resize; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tb { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; height: 28px; padding: 0 10px; }
.tb:hover { border-color: var(--dim); }
.tb[aria-pressed="true"] { background: var(--hot); color: #1a1100; border-color: var(--hot); font-weight: 600; }
.sel { height: 28px; padding: 0 8px; }
.kn { display: flex; align-items: center; gap: 6px; }
.kn span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }

/* knob + fader */
.knob { --n: 0; --c: var(--hot); width: 30px; height: 30px; border-radius: 50%; position: relative; flex: none; cursor: ns-resize; touch-action: none;
  background: conic-gradient(from -135deg, var(--c) 0 calc(var(--n) * 270deg), #2c3242 calc(var(--n) * 270deg) 270deg, transparent 270deg); }
.knob::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #20242f; border: 1px solid #3a4152; }
.knob::after { content: ''; position: absolute; left: calc(50% - 1px); top: 6px; width: 2px; height: 9px; background: #fff; border-radius: 1px; transform-origin: 50% 9px; transform: rotate(calc(-135deg + var(--n) * 270deg)); }
.knob.sm { width: 26px; height: 26px; }
.knob.sm::after { top: 5px; height: 8px; transform-origin: 50% 8px; }

/* mixer */
.mixer { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: thin; }
.strip { flex: 1 0 76px; max-width: 118px; border-right: 1px solid var(--line); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.strip.master { flex: none; width: 104px; max-width: none; margin-left: auto; background: var(--panel2); border-right: 0; border-left: 1px solid var(--line2); position: sticky; right: 0; }
.s-name { font-weight: 600; font-size: 11.5px; width: 100%; text-align: center; padding-bottom: 5px; border-bottom: 2px solid var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 4px; justify-items: center; }
.s-knobs label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.s-knobs .off { visibility: hidden; }
.s-fw { display: flex; gap: 6px; height: 128px; }
.meter { width: 9px; background: #0b0d11; border-radius: 3px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.meter i { position: absolute; inset: 0; transform-origin: 50% 100%; transform: scaleY(0); background: linear-gradient(to top, var(--ok) 0 62%, var(--hot) 62% 88%, var(--bad) 88%); will-change: transform; }
.meter b { position: absolute; left: 0; right: 0; height: 2px; bottom: 0; background: #fff; opacity: .75; }
.fader { width: 26px; position: relative; cursor: ns-resize; touch-action: none; }
.fader .trk { position: absolute; left: 11px; width: 4px; top: 6px; bottom: 6px; background: #0b0d11; border: 1px solid var(--line); border-radius: 2px; }
.fader .zero { position: absolute; left: 3px; right: 3px; height: 1px; background: var(--mute); }
.fader .hdl { position: absolute; left: 1px; width: 24px; height: 12px; margin-bottom: -6px; border-radius: 3px; background: linear-gradient(#4a5164, #343a49); border: 1px solid #5b6379; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.fader .hdl::after { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; margin-top: -1px; background: var(--c, var(--hot)); }
.s-db { font: 500 10.5px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.s-btns { display: flex; gap: 4px; }
.s-btns button { width: 26px; height: 20px; border-radius: 4px; border: 1px solid var(--line2); background: transparent; color: var(--mute); font: 700 10px var(--ui); padding: 0; }
.s-btns .bm[aria-pressed="true"] { background: var(--bad); color: #1a0500; border-color: var(--bad); }
.s-btns .bs[aria-pressed="true"] { background: var(--hot); color: #1a1100; border-color: var(--hot); }
.gr { font: 500 9.5px var(--mono); color: var(--dim); text-align: center; }
.start-note { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--hot); color: #1a1100; font-weight: 600; padding: 8px 14px; border-radius: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 20; }
/* bottom panel: Mixer / Sampler tabs */
.ptabs { padding: 0 6px; gap: 2px; }
.ptabs .t { background: none; border: 0; border-bottom: 2px solid transparent; height: 34px; padding: 0 12px; color: var(--dim); font: 600 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; }
.ptabs .t:hover { color: var(--fg); }
.ptabs .t[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--hot); }
.smp { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.smp.drag { outline: 2px dashed var(--hot); outline-offset: -5px; }
.smp h3 { margin: 0 0 2px; font: 600 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.smp h3 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.smp-top { display: grid; grid-template-columns: minmax(0, 1fr) 244px; gap: 16px; align-items: start; }
.smp-main, .smp-side { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.smp-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.smp-bar .hint { color: var(--dim); }
.smp-sec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.tb.file { display: inline-flex; align-items: center; position: relative; cursor: pointer; background: var(--hot); color: #1a1100; border-color: var(--hot); font-weight: 600; }
.tb.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.tb.file:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }
.tb.hot { background: var(--hot); color: #1a1100; border-color: var(--hot); font-weight: 600; height: 32px; }
.tb:disabled, .sel:disabled, .seg button:disabled, .tb.file:has(input:disabled) { opacity: .4; cursor: default; }
.out { font: 500 10.5px var(--mono); color: var(--dim); min-width: 40px; }
.wave-wrap { position: relative; background: var(--well); border: 1px solid var(--line); border-radius: 6px; height: 150px; overflow: hidden; }
#wave { display: block; touch-action: none; cursor: crosshair; }
.wave-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); padding: 12px; pointer-events: none; line-height: 1.6; }
.wave-empty b { color: var(--fg); font-weight: 600; }
.wave-empty small { color: var(--mute); }
#smpPan { width: 100%; accent-color: var(--hot); margin: 0; }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pad { aspect-ratio: 1; min-height: 48px; border-radius: 8px; border: 1px solid var(--line2); background: var(--cell); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 700 14px var(--mono); padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pad small { font: 500 9px var(--mono); color: var(--dim); min-height: 11px; }
.pad:disabled { opacity: .3; cursor: default; }
.pad:not(:disabled):hover { border-color: var(--dim); }
.pad:not(:disabled):active { background: #234656; border-color: #58d0ff; }
.pad.on { border-color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }
.zones { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.zone { display: inline-flex; align-items: stretch; background: var(--cell); border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.zone.on { border-color: var(--hot); }
.zone button { background: none; border: 0; color: var(--fg); }
.zsel { display: flex; flex-direction: column; align-items: flex-start; padding: 3px 10px; max-width: 220px; text-align: left; font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zsel small { font: 500 10px var(--mono); color: var(--dim); }
.zdel { width: 28px; color: var(--dim) !important; border-left: 1px solid var(--line2) !important; }
.zdel:hover { color: var(--bad) !important; }
@media (max-width: 760px) { .smp-top { grid-template-columns: 1fr; } .pads { max-width: 340px; } .smp { padding: 10px; } }
@media (max-width: 700px) { .strip.master { position: static; } .master-viz { margin-left: 0; } #spec { width: 110px; } .brand small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<header class="top panel" id="top">
  <div class="brand">FORGE <small>beat studio</small></div>
  <div class="tk">
    <button class="tbtn play" id="btnPlay" aria-pressed="false" aria-label="Play or pause (Space)" title="Play / Stop (Space)">
      <svg viewBox="0 0 16 16" id="icoPlay"><path d="M3 1.5v13l11-6.5z"/></svg>
      <svg viewBox="0 0 16 16" id="icoStop" hidden><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg>
    </button>
    <div class="readout" id="readout" aria-live="off">001<small>.</small>1<small>.</small>1</div>
  </div>
  <label class="fld"><span>Tempo</span><input type="number" id="bpm" min="60" max="200" step="1" value="140"></label>
  <div class="tk">
    <div class="fld"><span>Swing</span><div class="knob" id="kSwing"></div></div>
    <div class="fld"><span>Human</span><div class="knob" id="kHuman"></div></div>
  </div>
  <label class="fld"><span>Style</span>
    <select id="genre"><option value="trap">Trap</option><option value="drill">Drill</option><option value="rnb">R&amp;B</option><option value="afro">Afrobeat</option></select></label>
  <label class="fld"><span>Key</span><select id="key"></select></label>
  <label class="fld"><span>Scale</span><select id="scale"></select></label>
  <div class="fld"><span>Scale lock</span><button class="chk" id="lock" aria-pressed="true">Snap notes</button></div>
  <div class="fld"><span>Audio</span><button class="chk" id="lite" aria-pressed="false" title="Lighter reverb and fewer voices, for phones">Lite</button></div>
  <label class="fld"><span>Length</span><select id="bars"><option value="1">1 bar</option><option value="2">2 bars</option><option value="4">4 bars</option></select></label>
  <div class="master-viz">
    <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <canvas id="spec" width="300" height="72" aria-label="Master spectrum"></canvas>
    <div class="mm"><div class="meter" id="mmL"><i></i><b></b></div><div class="meter" id="mmR"><i></i><b></b></div></div>
  </div>
</header>

<main class="work">
  <section class="panel" aria-label="Channel rack">
    <div class="ph">
      <h2>Channel rack</h2>
      <div class="seg" role="group" aria-label="Step tool">
        <button id="toolDraw" aria-pressed="true">Draw</button><button id="toolRoll" aria-pressed="false" title="Click a step to cycle the roll: ×2 ×3 ×4 ×6 ×8">Roll</button>
      </div>
      <label class="kn"><span>Roll shape</span>
        <select class="sel" id="rollShape"><option value="flat">Flat</option><option value="up">Build up</option><option value="down">Fade out</option></select></label>
      <div class="sp"></div>
      <span class="hint">Click steps · right-click cycles a hi-hat roll</span>
    </div>
    <div class="rack-body">
      <div class="names" id="names"></div>
      <div class="steps" id="steps"><div class="steps-in" id="stepsIn"></div></div>
    </div>
    <div class="lane" id="laneBox">
      <div class="lane-l"><b id="laneName">Velocity</b><span>Drag bars to shape the groove. Steps with a number are rolls.</span></div>
      <div class="lane-r" id="laneR"><canvas id="vlane"></canvas></div>
    </div>
  </section>

  <section class="panel" aria-label="Piano roll">
    <div class="ph">
      <h2>Piano roll</h2>
      <span class="chip" id="rollChip"><i></i><span></span></span>
      <label class="kn"><span>Grid</span>
        <select class="sel" id="snap">
          <option value="4">1/4</option><option value="2">1/8</option><option value="1" selected>1/16</option><option value="0.5">1/32</option>
          <option value="1.3333333333">1/8 triplet</option><option value="0.6666666667">1/16 triplet</option></select></label>
      <button class="tb" id="btnSlide" aria-pressed="false" title="Glide the selected note from the one before it (S)">Slide</button>
      <button class="tb" id="btnQuant" title="Snap every note to the grid (Q)">Quantize</button>
      <button class="tb" id="btnGhost" aria-pressed="true" title="Show the other instruments faintly">Ghost</button>
      <button class="tb" id="btnClear">Clear</button>
      <div class="sp"></div>
      <div class="kn" id="k808" hidden>
        <span>Decay</span><div class="knob sm" id="kDecay"></div>
        <span>Glide</span><div class="knob sm" id="kGlide"></div>
        <span>Drive</span><div class="knob sm" id="kDrive"></div>
      </div>
    </div>
    <div class="roll-wrap">

function makeTicker(fn, ms) {
  try {
    const url = URL.createObjectURL(new Blob(['let t=setInterval(()=>postMessage(0),' + ms + ');onmessage=()=>{clearInterval(t);close()}'], { type: 'text/javascript' }));
    const w = new Worker(url); w.onmessage = fn;
    return { stop() { try { w.postMessage(0); w.terminate(); URL.revokeObjectURL(url); } catch (e) {} } };
  } catch (err) {
    const id = setInterval(fn, ms); return { stop() { clearInterval(id); } };
  }
}

const MAXSTEPS = 64;
let _nid = 1;
const N = name => {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
  return { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;

function row(str) {
  const s = str.replace(/[\s|]/g, ''), v = new Array(MAXSTEPS).fill(0), r = new Array(MAXSTEPS).fill(1);
  for (let i = 0; i < Math.min(s.length, MAXSTEPS); i++) {

}

  delete SLIB.drums[name]; renderDrums(); libSaveSoon(); if (!quiet) { const d = drumCh(name); if (d) ensureEngine().then(en => en.preview(d, 0)); }
}
function renderDrums() {
  const names = Object.keys(SLIB.drums).map(k => { const d = drumCh(k), c = SLIB.clips.find(x => x.id === SLIB.drums[k].clipId); return (d ? d.name : k) + ' ← ' + (c ? stem(c.name) : '?'); });
  $('drmList').textContent = names.length ? 'Using your sound: ' + names.join(', ') : '';
}
function initDrums() {
  const s = $('drmSel'); P.channels.filter(d => d.type === 'drum').forEach(d => s.add(new Option(d.name, d.drum)));
  $('drmCut').onclick = () => { const c = S.clip; if (!c || S.sel < 0) { toast('Select a cut first'); return; } applyDrum(s.value, c, c.slices[S.sel], cutEnd(S.sel)); };
  $('drmClip').onclick = () => { const c = S.clip; if (!c) { toast('Import a clip first'); return; } applyDrum(s.value, c, 0, c.buf.duration); };
  $('drmReset').onclick = () => resetDrum(s.value);
}

/* ---------- panel wiring ---------- */
function renderClips() {
  const s = $('smpClip'); s.innerHTML = '';
  SLIB.clips.forEach(c => s.add(new Option(stem(c.name), c.id)));
  if (!SLIB.clips.length) s.add(new Option('No clips yet', ''));
  s.value = S.clip ? S.clip.id : ''; s.disabled = !SLIB.clips.length;
  ['smpDel', 'smpPlay', 'smpAuto', 'smpHere', 'smpCut', 'smpClr', 'zOut', 'zIn', 'zFit', 'instAddCut', 'instAddAll', 'smpLay', 'drmCut', 'drmClip'].forEach(id => ($(id).disabled = !S.clip));
  $('smpEven').querySelectorAll('button').forEach(b => (b.disabled = !S.clip));
  updateInfo();
}
function updateInfo() { $('smpInfo').textContent = S.clip ? clipDur().toFixed(2) + ' s · ' + S.clip.slices.length + ' cut' + (S.clip.slices.length === 1 ? '' : 's') : ''; }
function setTab(t) {
  const m = t === 'mixer'; $('mixer').hidden = !m; $('sampler').hidden = m;
  $('tabMixer').setAttribute('aria-selected', m); $('tabSampler').setAttribute('aria-selected', !m);
  if (!m) requestAnimationFrame(drawWave);
}
function syncOpts() {
  $('smpRev').setAttribute('aria-pressed', S.opt.reverse); $('smpGate').setAttribute('aria-pressed', S.opt.gate);
  smpK.pitch.set(S.opt.pitch); $('pitchOut').textContent = (S.opt.pitch > 0 ? '+' : '') + S.opt.pitch + ' st'; smpK.sens.set(S.sens);
}
function initSampler() {
  $('sampler').innerHTML = SMP_HTML;
  $('tabMixer').onclick = () => setTab('mixer'); $('tabSampler').onclick = () => setTab('sampler');
  smpK.sens = Knob($('kSens'), { min: 0, max: 1, val: S.sens, def: 0.55, label: 'Sensitivity', fmt: v => Math.round(v * 100) + '%', onInput: v => { S.sens = v; clearTimeout(S.sT); S.sT = setTimeout(() => { if (S.clip && S.autoOn) autoChop(true); }, 120); } });
  smpK.pitch = Knob($('kPitch'), { min: -12, max: 12, val: 0, def: 0, label: 'Pitch (semitones)', fmt: v => Math.round(v) + ' st', onInput: v => {
    const r = Math.round(v); if (r === S.opt.pitch) return; S.opt.pitch = r; $('pitchOut').textContent = (r > 0 ? '+' : '') + r + ' st'; applyChop(); libSaveSoon(); } });
  buildPads(); initWave(); initInst(); initDrums();
  $('smpFile').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('smpClip').onchange = e => selectClip(e.target.value);
  $('smpDel').onclick = removeClip; $('smpPlay').onclick = playRaw;
  $('smpAuto').onclick = () => autoChop(false);
  $('smpEven').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) evenChop(+b.dataset.n); };
  $('smpHere').onclick = () => { if (S.cursor == null) toast('Click the waveform where you want the cut, then press Cut here'); else addCut(S.cursor); };
  $('smpCut').onclick = () => removeCut(S.sel);
  $('smpClr').onclick = () => { const c = S.clip; if (!c) return; c.slices = [c.slices[0] || 0]; S.sel = 0; S.autoOn = false; cutsChanged(); };
  $('smpRev').onclick = () => { S.opt.reverse = !S.opt.reverse; $('smpRev').setAttribute('aria-pressed', S.opt.reverse); applyChop(); libSaveSoon(); };
  $('smpGate').onclick = () => { S.opt.gate = !S.opt.gate; $('smpGate').setAttribute('aria-pressed', S.opt.gate); applyChop(); libSaveSoon(); };
  $('zIn').onclick = () => zoomBy(0.5); $('zOut').onclick = () => zoomBy(2); $('zFit').onclick = () => { fitView(); drawWave(); };
  $('smpLay').onclick = layOut;
  // drag a file anywhere onto the page
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  window.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); $('sampler').classList.add('drag'); } });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) $('sampler').classList.remove('drag'); });
  window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); $('sampler').classList.remove('drag'); addFiles(e.dataTransfer.files); });
  renderClips(); updatePads(); renderDrums();
}

/* ---------- restore the saved library (IndexedDB) ---------- */
async function restoreLib() {
  await libInit(); if (!SLIB.db) return;
  let rows = [], meta = [];
  try { rows = await idbAll('clips'); meta = await idbAll('meta'); } catch (e) { return; }
  for (const r of rows) {
    try { const c = await makeClipObj(r.id, r.name, r.bytes); c.slices = r.slices && r.slices.length ? r.slices : detectOnsets(c.buf, S.sens, MAXPADS); SLIB.clips.push(c); } catch (e) {}
  }
  const st = meta.find(m => m.k === 'state');
  if (st) {
    S.opt = { pitch: st.pitch || 0, reverse: !!st.reverse, gate: !!st.gate };
    LIB.inst.attack = st.attack || LIB.inst.attack; LIB.inst.release = st.release || LIB.inst.release; smpK.att.set(LIB.inst.attack); smpK.rel.set(LIB.inst.release);
    LIB.inst.zones = (st.zones || []).map(z => { const c = SLIB.clips.find(x => x.id === z.clipId); return c ? { ...z, id: _zid++, buf: zoneBuf(c, z.a, z.b) } : null; }).filter(Boolean);
    S.zi = LIB.inst.zones.length ? 0 : -1;
    for (const [name, v] of Object.entries(st.drums || {})) { const c = SLIB.clips.find(x => x.id === v.clipId); if (c) await applyDrum(name, c, v.a, v.b, true); }
  }
  syncOpts(); renderZones();
  const pick = st && SLIB.clips.find(c => c.id === st.clip) || SLIB.clips[0];
  selectClip(pick ? pick.id : null);
}
/* ===== Mixer: channel strips + master ===== */
let strips = {}, masterUI = null;

function buildMixer() {
  const mx = $('mixer'); mx.innerHTML = ''; strips = {};
  P.channels.forEach(d => {
    const s = document.createElement('div'); s.className = 'strip'; s.style.setProperty('--c', d.color);
    s.innerHTML = '<div class="s-name"></div><div class="s-knobs"><label>Pan<div class="kp"></div></label><label>Rev<div class="kr"></div></label><label>Dly<div class="kd"></div></label><label class="dk">Duck<div class="kk"></div></label></div>' +
      '<div class="s-fw"><div class="meter"><i></i><b></b></div><div class="fader"></div></div><div class="s-db"></div><div class="s-btns"><button class="bm" aria-label="Mute">M</button><button class="bs" aria-label="Solo">S</button></div>';
    s.querySelector('.s-name').textContent = d.name; s.querySelector('.s-name').title = d.name;
    const upd = () => { if (eng) eng.syncMix(); saveSoon(); };
    const kn = (sel, key, min, max, def, label) => Knob(s.querySelector(sel), { min, max, def, val: d.mix[key], label: d.name + ' ' + label, color: d.color, onInput: v => { d.mix[key] = v; upd(); } });
    kn('.kp', 'pan', -1, 1, 0, 'pan'); kn('.kr', 'rev', 0, 1, 0, 'reverb send'); kn('.kd', 'dly', 0, 1, 0, 'delay send');
    if (d.type === 'inst') kn('.kk', 'duck', 0, 1, 0, 'kick sidechain'); else s.querySelector('.dk').classList.add('off');
    s.querySelectorAll('.s-knobs .knob').forEach(k => k.classList.add('sm'));
    const dbEl = s.querySelector('.s-db');
    const fd = Fader(s.querySelector('.fader'), { val: d.mix.db, def: 0, color: d.color, label: d.name + ' level', onPaint: db => (dbEl.textContent = fmtDb(db)), onInput: db => { d.mix.db = db; upd(); } });
    const bm = s.querySelector('.bm'), bs = s.querySelector('.bs');
    bm.onclick = () => { d.mix.mute = !d.mix.mute; syncMixUI(); saveSoon(); };
    bs.onclick = () => { d.mix.solo = !d.mix.solo; syncMixUI(); saveSoon(); };
    mx.appendChild(s);
    strips[d.id] = { el: s, bm, bs, fd, meter: s.querySelector('.meter'), st: {} };
  });
  // master
  const m = document.createElement('div'); m.className = 'strip master'; m.style.setProperty('--c', '#e9ebf1');
  m.innerHTML = '<div class="s-name">Master</div><button class="tb" id="glue" aria-pressed="true" title="Bus compressor">Glue</button><div class="gr" id="gr">GR 0.0</div>' +
    '<div class="s-fw"><div class="meter" id="msL"><i></i><b></b></div><div class="meter" id="msR"><i></i><b></b></div><div class="fader" id="mfader"></div></div><div class="s-db" id="mdb"></div><div class="gr">limiter -4 dB</div>';
  mx.appendChild(m);
  const mdb = m.querySelector('#mdb');
  const fd = Fader(m.querySelector('#mfader'), { val: P.masterDb, def: 0, color: '#e9ebf1', label: 'Master level', onPaint: db => (mdb.textContent = fmtDb(db)), onInput: db => { P.masterDb = db; if (eng) eng.setMaster(db); saveSoon(); } });
  const glue = m.querySelector('#glue');
  glue.onclick = () => { const on = glue.getAttribute('aria-pressed') !== 'true'; glue.setAttribute('aria-pressed', on); if (eng) eng.setGlue(on); };
  masterUI = { fd, gr: m.querySelector('#gr'), L: m.querySelector('#msL'), R: m.querySelector('#msR'), stL: {}, stR: {} };
  syncMixUI();
}
function syncMixUI() {
  for (const d of P.channels) {
    const s = strips[d.id]; if (s) { s.bm.setAttribute('aria-pressed', d.mix.mute); s.bs.setAttribute('aria-pressed', d.mix.solo); }
    const nm = document.querySelector('.nrow[data-ch="' + d.id + '"] .m'); if (nm) nm.setAttribute('aria-pressed', d.mix.mute);
  }
  if (eng) eng.syncMix();
}
/* ===== Forge main: transport, presets, keyboard, animation loop ===== */
const drumsReady = prerenderDrums().then(b => (drumBufs = b));
let kSwing, kHuman;

function applyProject(np) {
  P = np; if (P.masterDb == null) P.masterDb = 0;
  if (eng) { eng.proj = P; eng.p808 = P.p808; eng.last808 = null; eng.setTempo(P.bpm); eng.setMaster(P.masterDb); eng.syncMix(); }
  if (!chOf(sel.inst)) sel.inst = 'bass'; if (!chOf(sel.drum)) sel.drum = 'hat';
  syncTransportUI(); buildRack(); buildMixer(); rollLayout(); rollSetChannel(); syncKnobs808();
}
function syncTransportUI() {
  $('bpm').value = P.bpm; kSwing.set(P.swing); kHuman.set(P.human); $('genre').value = P.genre; $('key').value = P.key; $('scale').value = P.scale;
  $('bars').value = P.bars; $('lock').setAttribute('aria-pressed', P.lock);
}
function loadPreset(key) {
  hist.push(JSON.stringify(P));                      // whole-project snapshot so Undo can bring the old beat back
  const wasPlaying = eng && eng.playing;
  applyProject(makeProject(key));
  if (wasPlaying) { eng.curStep = 0; }
  saveSoon();
}
function setBars(n) {
  const old = P.bars; if (n === old) return; snapshot();
  if (n > old) {
    const oL = old * 16, nL = n * 16;
    for (const d of P.channels) {
      if (d.type === 'drum') { if (d.v.slice(oL, nL).every(v => !v)) for (let i = oL; i < nL; i++) { d.v[i] = d.v[i % oL]; d.r[i] = d.r[i % oL]; } }
      else if (!d.notes.some(x => x.t >= oL)) { const base = d.notes.filter(x => x.t < oL).map(x => ({ ...x })); for (let k = 1; k * oL < nL; k++) base.forEach(x => d.notes.push({ ...x, id: _nid++, t: x.t + k * oL })); }
    }
  }
  P.bars = n; if (eng && eng.curStep >= n * 16) eng.curStep = 0;
  buildRack(); rollLayout(); rollSetChannel(); saveSoon();
}
async function togglePlay() {
  const en = await ensureEngine();
  if (en.playing) en.stop(); else { en.ctx.resume(); en.start(); }
  setPlayUI(en.playing);
}
function setPlayUI(on) {
  $('btnPlay').setAttribute('aria-pressed', on); $('icoPlay').hidden = on; $('icoStop').hidden = !on;
  if (!on) { $('phead').style.display = 'none'; $('rphead').style.display = 'none'; $('readout').innerHTML = '001<small>.</small>1<small>.</small>1'; }
}

function initTransport() {
  const ks = $('key'); NOTE_NAMES.forEach((n, i) => ks.add(new Option(n, i)));
  const sc = $('scale'); Object.keys(SCALES).forEach(k => sc.add(new Option(SCALE_LABELS[k], k)));
  kSwing = Knob($('kSwing'), { min: 0, max: 1, val: P.swing, def: 0, label: 'Swing', fmt: v => Math.round(v * 100) + '%', onInput: v => { P.swing = v; saveSoon(); } });
  kHuman = Knob($('kHuman'), { min: 0, max: 1, val: P.human, def: 0.2, label: 'Humanize', fmt: v => Math.round(v * 100) + '%', onInput: v => { P.human = v; saveSoon(); } });
  $('btnPlay').onclick = togglePlay;
  $('bpm').onchange = e => { P.bpm = clamp(Math.round(+e.target.value) || 120, 60, 200); e.target.value = P.bpm; if (eng) eng.setTempo(P.bpm); saveSoon(); };
  $('genre').onchange = e => loadPreset(e.target.value);
  ks.onchange = () => { P.key = +ks.value; bgRebuild(); saveSoon(); };
  sc.onchange = () => { P.scale = sc.value; bgRebuild(); saveSoon(); };
  $('lock').onclick = () => { P.lock = !P.lock; $('lock').setAttribute('aria-pressed', P.lock); saveSoon(); };
  $('bars').onchange = e => setBars(+e.target.value);
  $('btnUndo').onclick = doUndo;
  $('rphead').style.left = '0px';
  $('lite').onclick = () => setLite(!ui.lite);
  $('lite').setAttribute('aria-pressed', ui.lite);
}
const START_MSG = 'Press Play (or Space) to start the audio engine';
function toast(msg, ms) { const n = $('startNote'); n.textContent = msg; n.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { if (eng && eng.ctx.state === 'running') n.hidden = true; else n.textContent = START_MSG; }, ms || 3500); }
function setLite(on, auto) {
  ui.lite = on; if (!auto) { ui.stallLimit = on ? 3 : 8; if (eng) eng.stalls = 0; }     // choosing full quality by hand: be slower to override it
  $('lite').setAttribute('aria-pressed', on); try { localStorage.setItem('forge.lite', on ? '1' : '0'); } catch (e) {}
  if (eng) eng.setLite(on);
  if (auto) toast('Switched to Lite audio to keep playback steady');
}
// phones suspend audio when the screen sleeps or a call comes in: any tap brings it back
document.addEventListener('pointerdown', () => { if (eng && eng.ctx.state !== 'running') eng.ctx.resume(); }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && eng && eng.playing) eng.ctx.resume(); });
function doUndo() {
  const s = hist[hist.length - 1]; if (!s) return;
  if (s[0] === '{') { hist.pop(); applyProject(JSON.parse(s)); saveSoon(); } else undo();
}

/* ---- keyboard ---- */
const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
document.addEventListener('keydown', e => {
  if (typing(e)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); }
  else if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); R.sel = new Set(R.ch.notes.map(n => n.id)); rollRedraw(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (!mod && e.key.toLowerCase() === 's') toggleSlide();
  else if (!mod && e.key.toLowerCase() === 'q') quantize();
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && !typing(e)) e.preventDefault(); });

/* ---- animation loop: playhead, readout, meters, spectrum ---- */
const specCv = () => $('spec');
let specBins = null;
function drawSpectrum() {
  const cv = specCv(), x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.clearRect(0, 0, W, H);
  if (!eng) return;
  if (!specBins) specBins = new Uint8Array(eng.spec.frequencyBinCount);
  eng.spec.getByteFrequencyData(specBins);
  const nb = 42, hz = eng.ctx.sampleRate / eng.spec.fftSize, bw = W / nb;
  for (let k = 0; k < nb; k++) {
    const f0 = 28 * Math.pow(17000 / 28, k / nb), f1 = 28 * Math.pow(17000 / 28, (k + 1) / nb);
    let a = Math.floor(f0 / hz), b = Math.max(a + 1, Math.floor(f1 / hz)), mx = 0;
    for (let i = a; i < b && i < specBins.length; i++) mx = Math.max(mx, specBins[i]);
    const h = Math.pow(mx / 255, 1.5) * (H - 4);
    x.fillStyle = k < nb * 0.25 ? '#c58cff' : k < nb * 0.6 ? '#ffae3d' : '#6fe0b0';
    x.globalAlpha = 0.9; x.fillRect(k * bw + 1, H - h, bw - 2, h);
  }
  x.globalAlpha = 1;
}
let fcount = 0;
function frame() {
  fcount++;
  if (eng) {
    const pos = eng.position();
    if (pos >= 0) {
      $('phead').style.display = 'block'; $('phead').style.transform = 'translateX(' + (2 + pos * CELL - 1) + 'px)';
      $('rphead').style.display = 'block'; $('rphead').style.transform = 'translateX(' + (R.keyW + pos * R.pps - 1) + 'px)';
      const st = Math.floor(pos), bar = Math.floor(st / 16) + 1, beat = Math.floor((st % 16) / 4) + 1, sub = (st % 4) + 1;
      $('readout').innerHTML = String(bar).padStart(3, '0') + '<small>.</small>' + beat + '<small>.</small>' + sub;
    }
    if (eng.playing && !ui.lite && eng.stalls >= (ui.stallLimit || 3)) setLite(true, true);       // the scheduler keeps missing deadlines: lighten up automatically
    $('lite').title = 'Lighter reverb and fewer voices, for phones. Scheduler stalls: ' + eng.stalls;
    const metering = !ui.lite || fcount % 3 === 0;
    if (metering) for (const d of P.channels) { const s = strips[d.id]; if (s) meterFeed(s.meter, s.st, eng.peak(d.id)); }
    if (masterUI && metering) {
      const l = eng.peak('L'), r = eng.peak('R');
      meterFeed(masterUI.L, masterUI.stL, l); meterFeed(masterUI.R, masterUI.stR, r); meterFeed($('mmL'), $('mmL')._s || ($('mmL')._s = {}), l); meterFeed($('mmR'), $('mmR')._s || ($('mmR')._s = {}), r);
      masterUI.gr.textContent = 'GR ' + Math.abs(eng.comp.reduction || 0).toFixed(1);
    }
    if (!ui.lite) drawSpectrum();
  }
  requestAnimationFrame(frame);
}

function boot() {
  P = loadSaved() || makeProject('trap');
  if (P.masterDb == null) P.masterDb = 0;
  initTransport(); syncTransportUI();
  buildRack(); initRackEvents(); buildMixer(); initRoll(); rollSetChannel(); syncKnobs808();
  initSampler(); restoreLib();
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { rollLayout(); laneSize(); laneDraw(); }, 120); });
  requestAnimationFrame(() => { rollLayout(); rollSetChannel(); });
  requestAnimationFrame(frame);
  window.__forge = { get P() { return P; }, get eng() { return eng; }, ensureEngine, togglePlay, loadPreset, S, LIB, SLIB, addFiles, selectClip, layOut, restoreLib };
}
boot();
</script>
